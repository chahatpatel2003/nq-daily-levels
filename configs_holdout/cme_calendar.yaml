# Session clock. All rules are defined in America/Chicago (CT) because CME and
# Topstep define them in CT; data timestamps are UTC and get converted.
sessions:
  timezone: "America/Chicago"

  # CME Globex daily cycle (both CME equity index and COMEX metals):
  # open 17:00 CT previous calendar day, close 16:00 CT, maintenance 16:00-17:00.
  globex_open_ct: "17:00"
  globex_close_ct: "16:00"

  # A timestamp at/after 17:00 CT belongs to the NEXT calendar day's session.
  # Sunday 17:00 CT open => Monday's trade date.

  # Topstep intraday constraint: flat by 15:10 CT, no positions until reopen.
  # (Topstep risk managers begin flattening 15:08 CT; NQ also has the CME
  # equity 15:15-15:30 CT daily pause — both after our cutoff, so irrelevant.)
  eod_flatten_ct: "15:10"
  reopen_ct: "17:00"

  # Default research window (entries). Conservative: RTH-ish, well before the
  # flatten cutoff. Strategies may use narrower windows; never wider than
  # allowed_entry below without changing this config.
  allowed_entry:
    start_ct: "07:30"
    end_ct: "14:30"

  # Per-instrument reference RTH (for feature construction / regime tagging,
  # not for rule enforcement):
  rth:
    NQ: { start_ct: "08:30", end_ct: "15:00" }
    GC: { start_ct: "07:20", end_ct: "12:30" }   # COMEX floor hours reference

  # ------------------------------------------------------------------------
  # CME holiday calendar 2016-2026 (NQ + GC), populated 2026-07-03.
  #
  # SOURCES:
  #  - 2016-2025: empirically measured from CME Globex's actual recorded
  #    behavior in the local Databento CME data: GC 1-min bars (every weekday
  #    2016-2025 classified: zero day-session bars = full close; last-bar
  #    time = halt) and NQ trade prints (2021-2026H1 spot checks).
  #  - 2026 H1: verified against NQ trades (MLK/Presidents/Memorial halts at
  #    11:59:5x CT; 2026-01-01 fully closed; 2026-04-03 Good Friday traded a
  #    jobs-report mini session ending 08:14:58 CT).
  #  - 2026 H2 (Jul 3, Labor, Thanksgiving+Friday, Dec 24/25): derived from
  #    the stable CME holiday schedule pattern; VERIFY against the official
  #    CME notice (cmegroup.com holiday calendar) when published. A live
  #    fetch of cmegroup.com was attempted 2026-07-03 and blocked (JS/bot
  #    protection), so exchange-recorded data is the source of record here.
  #
  # SEMANTICS:
  #  - holidays: NOT valid trade dates. CME clearing is closed; all Globex
  #    activity from the prior 17:00 CT open through the holiday halt books
  #    to the NEXT trade date. Full-close entries have no early_closes row;
  #    halt entries do.
  #  - early_closes: calendar date -> Globex halt time (CT). Dates present
  #    here but NOT in holidays (day after Thanksgiving, Christmas Eve,
  #    July 3) are normal trade dates with a shortened session.
  #  - Halt times are the CONSERVATIVE MINIMUM across NQ and GC where they
  #    diverge: equity index halts 12:00 CT on halt holidays in all years;
  #    COMEX metals halted 12:00 CT through 2021 but 13:30 CT from 2022.
  #    Equity half days halt 12:15 CT; metals 12:45 CT (13:45 from 2024).
  #    Using the earlier time blocks up to ~90min of thin holiday GC trading
  #    — deliberate (Topstep strategies should not trade holiday sessions).
  #  - July 3 half days are equity-only (GC trades a full day); included
  #    globally as a conservative simplification.
  #  - Known non-events confirmed by data: no closure Fri 2021-12-31 (New
  #    Year 2022 fell on Saturday); COMEX metals traded normally on the
  #    2018-12-05 Bush mourning day (NYSE closed); Columbus/Veterans Day are
  #    normal CME sessions. gc_2020.parquet has DATA GAPS on 2020-02-28 and
  #    2020-06-30 (normal trading days — do not mistake them for closures).
  # ------------------------------------------------------------------------
